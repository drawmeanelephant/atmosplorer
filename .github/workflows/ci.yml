name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Pin the Swift toolchain so the build is deterministic regardless of
      # what Xcode version the runner image happens to ship. Must be >= 6.2:
      # the app relies on the SwiftUI View-body MainActor isolation that
      # landed in 6.2 (the local dev toolchain is newer still).
      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      # The vendored Zig core is not committed (the xcframework is a build
      # artifact); sync-zat.sh fetches the hash-pinned upstream zat and
      # regenerates it. Needs network + Zig 0.16+.
      - name: Install Zig 0.16
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      # The vendored source is hash-pinned upstream; cache it so CI only
      # hits Tangled on the first run (it rate-limits 429s) and later runs
      # skip the fetch entirely.
      - name: Cache vendored zat source
        uses: actions/cache@v4
        with:
          # v2: the v1 key got poisoned by an empty save from the first
          # failed run; the script now also falls back to fetching when a
          # restored source isn't a real zat checkout.
          path: zat-swift/.vendor/zat-src
          key: zat-src-v2-${{ hashFiles('zat-swift/Scripts/sync-zat.sh', 'zat-swift/Vendor/zat-overlay/**') }}

      - name: Vendor + test zat-swift
        run: |
          # Cache v4 restores files read-only; the overlay copy and zig build
          # write into the source dir, so grant write permission. No-op when
          # the cache missed and the dir doesn't exist.
          chmod -R u+w zat-swift/.vendor/zat-src 2>/dev/null || true
          cd zat-swift
          ZAT_SRC_DIR="$PWD/.vendor/zat-src" Scripts/sync-zat.sh
          swift build
          swift test          # offline; live tests gated behind ZAT_INTEGRATION=1

      - name: Build + test app
        run: |
          cd app
          swift build
          swift test          # fully offline (ZatFakeTransport + embedded CAR fixture)
